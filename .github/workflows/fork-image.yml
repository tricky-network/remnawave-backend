name: Patched Docker Image

on:
  push:
    branches:
      - patched

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_SUFFIX: patched

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/backend" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          # Patched frontend fork publishes releases tagged <backend version>-<suffix>
          frontend_tag="$version-$TAG_SUFFIX"
          frontend_repo="${GITHUB_REPOSITORY_OWNER}/frontend"
          echo "frontend_url=https://github.com/$frontend_repo/releases/download/$frontend_tag/remnawave-frontend.zip" >> $GITHUB_OUTPUT
          echo "frontend_commit=$(curl -s https://api.github.com/repos/$frontend_repo/commits/$frontend_tag | jq -r '.sha')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          # Single manifest without attestation children, so every untagged version is safe to delete
          provenance: false
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ env.TAG_SUFFIX }}
            ${{ steps.meta.outputs.image }}:latest-${{ env.TAG_SUFFIX }}
          build-args: |
            FRONTEND_URL=${{ steps.meta.outputs.frontend_url }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}

      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: backend
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
